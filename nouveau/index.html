<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0c0f08">
  <title>Dino·Hybride — L'Île d'Ambrelune</title>
  <link rel="icon" type="image/svg+xml" href="../icon.svg">
  <style>
    html, body { margin: 0; height: 100%; background: #0c0f08; overflow: hidden; overscroll-behavior: none; touch-action: none; }
    #game, #game canvas { position: fixed; inset: 0; width: 100vw !important; height: 100vh !important; height: 100dvh !important; }
    #title { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(ellipse at 50% 70%, #2f5a22 0%, #13200e 55%, #070a05 100%); font-family: system-ui, -apple-system, sans-serif; color: #f6ecd2; text-align: center; padding: 24px; }
    #title .sub { letter-spacing: 6px; font-size: 12px; color: #f2c14e; font-weight: 700; }
    #title h1 { margin: 0; font-size: clamp(40px, 11vw, 72px); font-weight: 900; letter-spacing: 3px;
      background: linear-gradient(180deg, #fff3c8, #e8a020 60%, #8a4a08); -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6)); }
    #title .tag { opacity: 0.75; font-style: italic; margin-bottom: 18px; }
    #title button { width: min(280px, 80vw); padding: 15px; border-radius: 14px; font: 800 17px system-ui, sans-serif; cursor: pointer; }
    #new { background: #e8a020; color: #1a1208; border: none; }
    #continue { background: transparent; color: #f6ecd2; border: 2px solid #c9953a; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="title">
    <div class="sub">DINO·HYBRIDE</div>
    <h1>AMBRELUNE</h1>
    <div class="tag">L'île où dorment les géants</div>
    <button id="continue" hidden>Continuer</button>
    <button id="new">Nouvelle partie</button>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
