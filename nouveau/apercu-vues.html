<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>Aperçu des vues</title>
<style>body{margin:0;background:#2a3a24;color:#f3ead2;font:13px system-ui}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}.c{background:#3c5a34;border-radius:10px;padding:4px}.c svg{width:100%;height:170px;display:block}</style></head>
<body><div class="g" id="g"></div>
<script type="module">
import { DINOS } from "../src/data/dinos.js";
import { buildDino } from "./src/art/dinoArt.js";
import { buildDinoView } from "./src/art/dinoViews.js";
const idx = (n) => DINOS.findIndex((d) => d.name.startsWith(n));
const pure = (n) => { const i = idx(n); return { head: i, teeth: i, frontLegs: i, backLegs: i, back: i, tail: i, color: i }; };
const list = (new URLSearchParams(location.search).get("d") || "Triceratops,Velociraptor,Spinosaurus,Tyrannosaurus,Stegosaurus,Brachiosaurus").split(",");
const g = document.getElementById("g");
for (const n of list) for (const v of ["side", "front", "back"]) {
  const d = v === "side" ? buildDino(pure(n)) : buildDinoView(pure(n), v);
  g.insertAdjacentHTML("beforeend", `<div class="c">${d.svg}<div>${n} — ${v}</div></div>`);
}
</script></body></html>
