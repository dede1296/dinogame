<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c0f08">
  <meta name="robots" content="noindex">
  <!-- Ambrelune moved from /dinogame/nouveau/ to /dinogame/: send old links and installs there. -->
  <meta http-equiv="refresh" content="0; url=../">
  <title>Ambrelune</title>
  <style>body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c0f08; color: #f6ecd2; font-family: system-ui, sans-serif; } a { color: #f2c14e; }</style>
</head>
<body>
  <p>Ambrelune a déménagé : <a href="../">ouvrir le jeu</a></p>
  <script>
    // Remove the worker that served the game at the old address, then go to the new one.
    const go = () => location.replace("../" + location.search);
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((regs) => Promise.all(regs.filter((r) => r.scope.endsWith("/nouveau/")).map((r) => r.unregister())))
        .finally(go);
    } else {
      go();
    }
  </script>
</body>
</html>
