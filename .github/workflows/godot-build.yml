name: Godot — APK Android et build Web

# Ambrelune, prototype Godot (dossier Godot/). Indépendant du déploiement Phaser (deploy.yml).
# - Lancement manuel (onglet Actions › « Run workflow ») : APK + build Web en artefacts.
# - Chaque push sur godot-prototype publie aussi le build Web sur GitHub Pages : le jeu se joue
#   dans le navigateur, sans rien installer (le preset Web a thread_support=false, donc il tourne
#   sur Pages, qui n'envoie pas les en-têtes d'isolation d'origine).
# - Chaque push sur godot-prototype publie AUSSI une Release « Ambrelune Godot — build N »
#   avec Ambrelune.apk : c'est de là qu'on installe le jeu sur le téléphone, sans compte ni zip.
# - Tag « godot-v* » (ex. godot-v0.1.0) : une Release de version, marquée pré-version.
# Signature : secret ANDROID_DEBUG_KEYSTORE_BASE64 (keystore encodé en base64) s'il existe,
# sinon un keystore jetable (il faudra alors désinstaller l'ancienne version avant d'installer).

on:
  workflow_dispatch:
  push:
    tags: ["godot-v*"]
    # Chaque mise à jour du prototype sur sa branche produit un APK (onglet Actions).
    branches: [godot-prototype]
    paths: ["Godot/**", ".github/workflows/godot-build.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

# Une seule publication Pages à la fois.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Godot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot et modèles d'export
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}

      - name: Installer Godot et les modèles d'export
        run: |
          V="${GODOT_VERSION}-${GODOT_STATUS}"
          URL="https://github.com/godotengine/godot/releases/download/${V}"
          mkdir -p ~/godot-dl && cd ~/godot-dl
          if [ ! -f godot ]; then
            curl -fsSL -o editor.zip "${URL}/Godot_v${V}_linux.x86_64.zip"
            unzip -q editor.zip && mv "Godot_v${V}_linux.x86_64" godot && rm editor.zip
          fi
          [ -f templates.tpz ] || curl -fsSL -o templates.tpz "${URL}/Godot_v${V}_export_templates.tpz"
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}
          mkdir -p "$T" /tmp/tpl && unzip -q -o templates.tpz -d /tmp/tpl && cp -r /tmp/tpl/templates/* "$T/"
          echo "$HOME/godot-dl" >> "$GITHUB_PATH"

      - name: Réglages Android de l'éditeur (SDK du runner, Java 17)
        run: |
          MINOR="${GODOT_VERSION%.*}"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${MINOR}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

      - name: Keystore de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/debug.keystore
          else
            echo "::warning::Pas de secret ANDROID_DEBUG_KEYSTORE_BASE64 : keystore jetable."
            keytool -genkeypair -keystore ~/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Import des ressources
        run: godot --headless --import

      - name: Export Android (APK)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/Ambrelune.apk
          test -s build/android/Ambrelune.apk

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -s build/web/index.pck
          # Le jeu tient dans un cadre de téléphone au milieu de la page (voir le script).
          node tools/web/cadre.mjs build/web/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: Ambrelune-android
          path: Godot/build/android/Ambrelune.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ambrelune-web
          path: Godot/build/web/

      # Le même build Web, prêt pour GitHub Pages (publié par le job « pages »).
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/godot-prototype'
        with:
          path: Godot/build/web/

      - name: GitHub Release (tags godot-v*)
        if: startsWith(github.ref, 'refs/tags/godot-v')
        uses: softprops/action-gh-release@v2
        with:
          files: Godot/build/android/Ambrelune.apk
          prerelease: true

      # Chaque push sur la branche du prototype publie une Release « build N » : l'APK se
      # télécharge directement depuis la page Releases (téléphone, sans compte ni zip).
      # `make_latest` est ce qui la fait apparaître : sans lui, GitHub n'en marque aucune
      # « Latest », l'encadré Releases de l'accueil reste vide et le dernier build se perd au
      # milieu des autres (godot-build-9 passe avant godot-build-16 dans un tri par nom).
      # D'où aussi `prerelease: false` : une pré-version ne peut jamais être la dernière.
      - name: GitHub Release (build de la branche)
        if: github.ref == 'refs/heads/godot-prototype'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: godot-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Ambrelune Godot — build ${{ github.run_number }}
          body: |
            Prototype Godot d'Ambrelune, commit ${{ github.sha }}.
            Installer : télécharger Ambrelune.apk sur le téléphone puis l'ouvrir.
          files: Godot/build/android/Ambrelune.apk
          prerelease: false
          make_latest: true

  # Met le build Web en ligne : https://dede1296.github.io/dinogame/
  pages:
    needs: build
    if: github.ref == 'refs/heads/godot-prototype'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
