name: Déploiement GitHub Pages (ancien jeu web, à la demande)

# Ancien prototype web ; le jeu est maintenant sous Godot (Godot/, workflow godot-build.yml),
# qui publie sa version Web sur la même page GitHub Pages. Ce workflow ne part donc plus tout
# seul : il ne se lance qu'à la main, et il écrase alors la page avec l'ancien jeu.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
